[device]
codename = "y2q"
brand = "Samsung"
model = "Galaxy S20+ 5G"
# 三星不用 A/B 无缝更新:boot/recovery 等分区不带 _a/_b 后缀
ab = false
# Fox 基底镜像只有 64MB,不是整个 recovery 分区;出包时按真实分区大小
# (BOARD_RECOVERYIMAGE_PARTITION_SIZE)补齐并签名。
recovery_size = 82694144
soc = { hans = "骁龙®865移动平台", hant = "Snapdragon® 865 行動平台", en = "Snapdragon® 865 Mobile Platform" }
# OS 版本用各 ROM 通用的系统版本字段:OneUI 显示 OneUI 版本、Flyme 显示 Flyme、
# Lineage 显示 lineage 构建号,换 ROM 自动跟着变
os_version_prop = "ro.build.display.id"
# 首次启动默认说中文;之后在设置里选的语言照样会被记住
lang = "zh-CN"

[display]
# 面板首选模式是 1080x2400;密度按这个宽度调,让 dp 空间和 p3q 一致(约 460dp)
density = 375
diagonal = 6.7
# 首次启动的亮度滑杆位置:面板刻度 0..50000,OneUI 默认 25500(约 51%)
brightness = 0.5
# S20+ 的圆角半径;按真机效果微调
corner_radius = 60

[touch]
# 三星 Y79A 触摸控制器默认 60Hz 采样,而面板跑在 120Hz:手指拖动会
# 跟不上画面。set_scan_rate 的两个参数是 enable=1、mode=2(HS120),
# 与 OneUI 在高刷模式下写的一样。命令在触摸设备出现时写入(控制器已上电)。
writes = [{ path = "/sys/class/sec/tsp/cmd", value = "set_scan_rate,1,2" }]

[modules]
# WLAN 的 Broadcom dhd 驱动(SM8250 的 BCM4375)编进了内核,不需要模块
sources = ["vendor_boot"]
load = []

[wlan]
modules = []
# 接口由内核里的 dhd 在开机时就建好,所以这里不用加载模块;但驱动要到
# 接口 up 时才下载固件、读 NVRAM,名字由 macloader 在系统里写进这两个
# 参数(它写的就是这两个裸名字,芯片/模块后缀由驱动自己拼):
#   bcmdhd_sta.bin -> /vendor/firmware/bcmdhd_sta.bin_b1
#   nvram.txt      -> /vendor/firmware/nvram.txt_1rh_es43_b1(按本机模块选)
writes = [
    { path = "/sys/module/dhd/parameters/firmware_path", value = "bcmdhd_sta.bin" },
    { path = "/sys/module/dhd/parameters/nvram_path", value = "nvram.txt" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
# supplicant 是 vendor 程序:vendor 自己的库最先,之后是手机建它时用的
# vendor 接口库(VNDK APEX,$bundle),最后是 recovery 和安装系统里的库
# (libcgrouprc 只在安装系统里有;libnl 必须在 VNDK 里那份,新系统里的
# 少了 sk_dup)。recovery 的 liblog 比 VNDK 的 libc++ 新,预加载它配套
# 的 libc++。
libraries = ["/vendor/lib64", "$bundle", "/system/lib64", "/mnt/system/system/lib64"]
preload = ["/system/lib64/libc++.so"]
# supplicant 是 HIDL 服务(vendor 的 rc 里注册 @1.0~1.3 和三星 @3.0/3.1),
# 不走 servicemanager 的 AIDL 描述,所以不写 service
probe = "http://connectivitycheck.gstatic.com/generate_204"

[backup]
# 三星自己的 NV 分区加上高通的基带设置分区
efs = ["efs", "sec_efs", "modemst1", "modemst2", "fsg", "fsc"]

# 震动:三星 vibrator 走 timed_output,写毫秒数就震
[haptics]
strength = { lightest = 0.2, strongest = 1.0 }

[haptics.timed]
duration = "/sys/class/timed_output/vibrator/enable"
intensity = "/sys/class/timed_output/vibrator/intensity"
intensity_max = 10000
click = 30
ticks = 12

[wipe]
logs = [
    "/data/log",
    "/data/vendor/log",
    "/data/vendor/tombstones",
    "/data/vendor/wifi",
]
