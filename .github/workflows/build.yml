name: Build

# Every push is linted and tested, and the recovery is built for every
# device in devices/, each image zipped. A tag starting with v publishes
# those zips as a release, each shown as the phone it is for. Run by hand,
# it can build for one device alone.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      device:
        description: The codename of the one device to build for; every device when empty
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # A release goes by its tag to whoever downloads it, and a build by the
  # version built into it, which is what it holds against the newest
  # release's tag when it looks for an update: a tag naming another
  # version than the one built would have every phone find an update in
  # the very build it runs. Such a tag publishes nothing.
  tag:
    name: Check that the tag names the version built
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Hold the tag against the workspace's version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME, and the workspace builds version $version"
            exit 1
          fi

  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Lint what runs on the computer
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Lint what runs on the phone
        run: cargo ndk -t arm64-v8a --platform 30 clippy --locked --workspace --all-targets -- -D warnings

  tools:
    name: Build the recovery service and the packer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build the recovery service for the phone
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward
      # It runs as a second system's first program, before any library is
      # there to load.
      - name: Build the second system's first program, static
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward-system-init --target-dir target/system-init
      - name: Build the packer
        run: cargo build --locked --release -p skyward-pack
      - name: Gather them
        run: |
          mkdir tools
          cp target/aarch64-linux-android/release/skyward target/release/skyward-pack tools/
          cp target/system-init/aarch64-linux-android/release/system-init tools/
      - uses: actions/upload-artifact@v7
        with:
          name: tools
          path: tools/
          if-no-files-found: error
          retention-days: 1

  devices:
    name: List the devices
    runs-on: ubuntu-24.04
    outputs:
      devices: ${{ steps.list.outputs.devices }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          if [ -n "$DEVICE" ]; then
            test -f "devices/$DEVICE.toml"
            echo "devices=$(jq -nc --arg device "$DEVICE" '[$device]')" >> "$GITHUB_OUTPUT"
          else
            echo "devices=$(basename -s .toml devices/*.toml | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          fi

  recovery:
    name: Recovery for ${{ matrix.device }}
    needs: [tools, devices]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.devices.outputs.devices) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: tools
          path: tools
      - name: Make the tools runnable
        run: chmod +x tools/skyward tools/skyward-pack
      # A device whose [stock] build is named takes its recovery partition out
      # of that build's full package on the maker's server. One built on a
      # third-party recovery (the Samsung phones, on OrangeFox) takes the
      # whole recovery image from the `base-images` release of this
      # repository, each named `<codename>-fox-recovery.img`.
      - name: Which recovery the device's is made on
        id: base
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          if grep -q '^\[stock\]' "devices/$DEVICE.toml"; then
            echo "kind=stock" >> "$GITHUB_OUTPUT"
          else
            echo "kind=fox" >> "$GITHUB_OUTPUT"
          fi
      - name: Read the stock build the recovery is made on
        if: steps.base.outputs.kind == 'stock'
        id: stock
        run: tools/skyward-pack stock --config "devices/${{ matrix.device }}.toml" >> "$GITHUB_OUTPUT"
      - name: Restore the stock recovery
        if: steps.base.outputs.kind == 'stock'
        id: cache
        uses: actions/cache@v6
        with:
          path: stock/recovery.img
          key: stock-recovery-${{ steps.stock.outputs.recovery }}
      # Only what the recovery partition takes is read of the package,
      # which is several gigabytes in all.
      - name: Take the recovery partition out of the stock package
        if: steps.base.outputs.kind == 'stock' && steps.cache.outputs.cache-hit != 'true'
        run: tools/skyward-pack stock --config "devices/${{ matrix.device }}.toml" --out stock/recovery.img
      - name: Check the stock recovery
        if: steps.base.outputs.kind == 'stock'
        env:
          RECOVERY: ${{ steps.stock.outputs.recovery }}
        run: echo "$RECOVERY  stock/recovery.img" | sha256sum --check
      # The base image is the whole recovery partition, AVB footer and all,
      # exactly what the phone holds there.
      - name: Take the base recovery image
        if: steps.base.outputs.kind == 'fox'
        env:
          DEVICE: ${{ matrix.device }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p stock
          gh release download base-images --repo "$GITHUB_REPOSITORY" \
            --pattern "$DEVICE-fox-recovery.img" --output stock/recovery.img --clobber
      # A phone whose kernel or vendor leaves pieces out carries them in a zip
      # in the same release, its entries laid out as they go into the ramdisk.
      - name: Take the phone's extra files
        if: steps.base.outputs.kind == 'fox'
        env:
          DEVICE: ${{ matrix.device }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p extras
          gh release download base-images --repo "$GITHUB_REPOSITORY" \
            --pattern "$DEVICE-files.zip" --output "$DEVICE-files.zip" --clobber || true
          if [ -f "$DEVICE-files.zip" ]; then
            unzip -q "$DEVICE-files.zip" -d extras
          fi
      - name: Pack the recovery
        id: pack
        env:
          DEVICE: ${{ matrix.device }}
          STOCK: ${{ steps.stock.outputs.version || 'base' }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; else version="${GITHUB_SHA::7}"; fi
          name="skyward-$version-$DEVICE-$STOCK"
          # A base image smaller than the recovery partition is padded out to
          # the size the phone's device configuration names.
          size=$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb")).get("device", {}).get("recovery_size", ""))' "devices/$DEVICE.toml")
          args=()
          if [ -n "$size" ]; then args+=(--partition-size "$size"); fi
          while IFS= read -r -d '' file; do
            args+=(--add-file "$file=${file#extras/}")
          done < <(find extras -type f -print0)
          mkdir out
          tools/skyward-pack recovery --stock stock/recovery.img --binary tools/skyward --system-init tools/system-init \
            --config "devices/$DEVICE.toml" --font resources/fonts/MiSansVF.ttf --mono resources/fonts/KirkMono-Regular.ttf \
            --mono-license resources/fonts/KirkMono-OFL.txt --third-party --no-mtp "${args[@]}" --out "out/$name.img"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      # The image is the whole partition, flashed as it is, and most of it
      # is the room the recovery leaves empty; it is handed out zipped.
      - name: Zip the image
        working-directory: out
        env:
          NAME: ${{ steps.pack.outputs.name }}
        run: zip -9 "$NAME.zip" "$NAME.img"
      # The artifact takes the zip's name.
      - uses: actions/upload-artifact@v7
        with:
          path: out/${{ steps.pack.outputs.name }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: [tag, check, recovery]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The devices' configurations say which phone each zip is for.
      - uses: actions/checkout@v7
      # Each artifact is a zip, which the download keeps whole under its
      # name, as it is handed out.
      - uses: actions/download-artifact@v8
        with:
          pattern: skyward-*
          path: images
          merge-multiple: true
          skip-decompress: true
      - name: Sum the zips
        working-directory: images
        run: sha256sum -- *.zip > SHA256SUMS
      # Each zip shows on the release as the phone it is for, its model and
      # then its codename, which is how people look for theirs; a device
      # whose zip is missing stops the release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          zips=()
          for config in devices/*.toml; do
            device=$(basename "$config" .toml)
            model=$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["device"]["model"])' "$config")
            zip=$(ls images/skyward-"$GITHUB_REF_NAME"-"$device"-*.zip)
            zips+=("$zip#$model ($device)")
          done
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes "${zips[@]}" images/SHA256SUMS
