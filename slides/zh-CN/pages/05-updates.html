<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../../readme.css">
</head>
<body>
<main class="slide feature">
  <header class="head">
    <p class="eyebrow">在线更新</p>
    <h1 class="headline">在线更新 <span translate="no">Skyward</span>。</h1>
    <p class="body">连接 WLAN 后，<span translate="no">Skyward</span> 从 <span translate="no">GitHub</span> 上的<br>最新版本更新自己。</p>
  </header>
  <div class="visual">
    <ul class="flows">
    <li>
        <p><span translate="no">Skyward</span> 更新</p>
        <ol>
          <li><span><span translate="no">GitHub</span> 上的<br>最新版本</span></li>
          <li class="to"><svg viewBox="0 0 24 24"><path class="icon-line" d="M5 12h14M13 6l6 6-6 6"/></svg></li>
          <li><span>下载本机的版本</span></li>
          <li class="to"><svg viewBox="0 0 24 24"><path class="icon-line" d="M5 12h14M13 6l6 6-6 6"/></svg></li>
          <li class="hot"><span>写入<br>recovery 分区</span></li>
        </ol>
      </li>
      <li>
        <p>自动重新刷入 <span translate="no">Skyward</span></p>
        <ol>
          <li><span>系统更新<br>或刷机包</span></li>
          <li class="to"><svg viewBox="0 0 24 24"><path class="icon-line" d="M5 12h14M13 6l6 6-6 6"/></svg></li>
          <li><span>覆盖<br>recovery 分区</span></li>
          <li class="to"><svg viewBox="0 0 24 24"><path class="icon-line" d="M5 12h14M13 6l6 6-6 6"/></svg></li>
          <li class="hot"><span>重新刷回<br><span translate="no">Skyward</span></span></li>
        </ol>
      </li>
    </ul>
  </div>
</main>
</body>
</html>
